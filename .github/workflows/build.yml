name: APK

# Compila la app y publica el APK como asset de una release. Un asset de release
# se descarga de un toque desde el navegador del teléfono; un artefacto exige
# iniciar sesión y llega comprimido.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar el APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/BT-Juicer.apk

      - name: Subir como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BT-Juicer-apk
          path: out/BT-Juicer.apk
          if-no-files-found: error

      - name: Publicar release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "BT Juicer — última compilación" \
              --notes "APK de depuración compilado automáticamente. Descarga BT-Juicer.apk y ábrelo en el teléfono." \
              --prerelease
          fi
          gh release upload "$TAG" out/BT-Juicer.apk --clobber
          echo "APK: $(gh release view "$TAG" --json url --jq .url)"
