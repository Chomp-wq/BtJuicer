name: APK

# Compila la app y publica el APK como asset de una release. Un asset de release
# se descarga de un toque desde el navegador del teléfono; un artefacto exige
# iniciar sesión y llega comprimido.
on:
  push:
    branches: [main, claude/secret-savior-05ik70, claude/vibrant-einstein-zmegxo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Pruebas de Secret Savior
        run: ./gradlew :savior:testDebugUnitTest --no-daemon --stacktrace

      # Release (R8 activado), no debug: una app «debuggable» corre con menos optimización de ART
      # y sin R8, y el DNS y el guardián lo notan. Va firmada con la clave de depuración fija,
      # así que se instala encima del APK anterior.
      - name: Compilar Secret Savior (release)
        run: ./gradlew :savior:assembleRelease --no-daemon --stacktrace

      - name: Renombrar los APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/BT-Juicer.apk
          cp savior/build/outputs/apk/release/savior-release.apk out/Secret-Savior.apk

      - name: Subir como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BT-Juicer-apk
          path: out/BT-Juicer.apk
          if-no-files-found: error

      - name: Subir Secret Savior como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Secret-Savior-apk
          path: out/Secret-Savior.apk
          if-no-files-found: error

      - name: Publicar release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "BT Juicer — última compilación" \
              --notes "APK compilados automáticamente (BT-Juicer.apk de depuración y Secret-Savior.apk de release). Descarga el que quieras y ábrelo en el teléfono." \
              --prerelease
          fi
          gh release upload "$TAG" out/BT-Juicer.apk out/Secret-Savior.apk --clobber
          echo "APK: $(gh release view "$TAG" --json url --jq .url)"
